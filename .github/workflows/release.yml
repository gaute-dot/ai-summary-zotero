name: Release
# Publishes a GitHub release when the plugin version changes on the default
# branch (or when a tag like v1.2.0 is pushed). Zotero finds updates through
# the updates.json attached to the latest release.
on:
  push:
    # Branch pushes run only when these files change; tag pushes always run.
    branches:
      - "**"
    tags:
      - "v*"
    paths:
      - plugin/manifest.json
      - .github/workflows/release.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Decide whether to publish
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          VERSION=$(python3 -c "import json;print(json.load(open('plugin/manifest.json'))['version'])")
          TAG="v$VERSION"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$TAG" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest version $VERSION"; exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "branch" ] && [ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]; then
            echo "Not the default branch; nothing to publish."; echo "publish=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists."; echo "publish=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
      - if: steps.check.outputs.publish == 'true'
        run: node test/run.js
      - if: steps.check.outputs.publish == 'true'
        run: ./build.sh
      - name: Publish release
        if: steps.check.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.check.outputs.tag }}
        run: |
          gh release create "$TAG" dist/*.xpi dist/updates.json --target "$GITHUB_SHA" \
            --title "AI Summary for Zotero $TAG" \
            --notes "Install: download the .xpi below, then in Zotero open Tools → Plugins → gear icon → Install Plugin From File…. Installed copies update automatically through Tools → Plugins → Check for Updates."
